data:
  format: npy_csv
  curves_path: data/synthetic/4_parameters/analyticModelEXPSOE_Run1_20230328_07-55-00.npy
  params_path: data/synthetic/4_parameters/lista_amEXPSOE.csv
  params_csv_sep: ";"
  n_days: 421
  n_params: 4
  param_names: [Radius, Mass, Energy, Nichel]
  samples_per_day: 1

# Shared preprocessing
preprocessing:
  pca_components: 32
  n_splits: 2
  random_seed: 42

augmentation:
  noise_std: 0.05

# Characterizer: curves -> params (SplitMLPRegressor)
characterizer:
  model:
    width: 512
    depth: 10
    dropout: 0.1
  training:
    batch_size: 4096
    epochs: 1000
    learning_rate: 0.001
  checkpoint:
    model: best_characterizer.pth
    x_scaler: best_char_x_scaler.pkl
    y_scaler: best_char_y_scaler.pkl
    pca: best_char_pca.pkl

# Generator: params -> curves (MLPWithResiduals)
generator:
  model:
    width: 512
    depth: 10
    dropout: 0.1
  training:
    batch_size: 4096
    epochs: 1000
    learning_rate: 0.001
  checkpoint:
    model: best_generator.pth
    x_scaler: best_gen_x_scaler.pkl
    y_scaler: best_gen_y_scaler.pkl
    pca: best_gen_pca.pkl

data:
  format: parquet
  path: data/dataset_preprocessed.parquet
  n_days: 1601
  n_params: 7
  param_names: [Raggio, Massa, Energia, Nickel, Mcsm, Rcsm, Slope]
  samples_per_day: 4

training:
  batch_size: 4096
  epochs: 1000
  learning_rate: 0.001
  n_splits: 2
  random_seed: 42

model:
  pca_components: 32
  width: 512
  depth: 10
  dropout: 0.1

loss:
  alpha_char: 1.0
  alpha_gen: 1.0

augmentation:
  noise_std: 0.05

checkpoint:
  model: experiments/20260306_162350/best_split_mlp_model.pth
  x_scaler: experiments/20260306_162350/best_split_mlp_x_scaler.pkl
  y_scaler: experiments/20260306_162350/best_split_mlp_y_scaler.pkl
  pca: experiments/20260306_162350/best_split_mlp_pca.pkl

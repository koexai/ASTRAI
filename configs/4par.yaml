data:
  format: npy_csv
  curves_path: data/synthetic/4_parameters/analyticModelEXPSOE_Run1_20230328_07-55-00.npy
  params_path: data/synthetic/4_parameters/lista_amEXPSOE.csv
  params_csv_sep: ";"
  n_days: 421
  n_params: 4
  param_names: [Radius, Mass, Energy, Nichel]
  samples_per_day: 1

training:
  batch_size: 4096
  epochs: 1000
  learning_rate: 0.001
  n_splits: 2
  random_seed: 42

model:
  pca_components: 32
  width: 512
  depth: 10
  dropout: 0.1

loss:
  alpha_char: 1.0
  alpha_gen: 1.0

augmentation:
  noise_std: 0.05

visualisation:
  y_label: '$\log_{10}(L_{\rm bol}\,[{\rm erg}\,{\rm s}^{-1}])$'
  one_at_a_time:
    output_name: clean_light_curves_4par
    reference:
      Radius: 13.0
      Mass: 20.0
      Energy: 4.5
      Nichel: 0.05
    levels:
      Radius: [1.0, 13.0, 25.0]
      Mass: [10.0, 20.0, 30.0]
      Energy: [0.5, 4.5, 9.5]
      Nichel: [0.01, 0.05, 0.10]
    titles:
      Radius: 'Progenitor radius $R_\star$ [$10^{12}$ cm]'
      Mass: 'Ejecta mass $M_{\rm ej}$ [$M_\odot$]'
      Energy: 'Explosion energy $E_K$ [$10^{51}$ erg]'
      Nichel: 'Nickel mass $M(^{56}{\rm Ni})$ [$M_\odot$]'

checkpoint:
  model: best_split_mlp_model.pth
  x_scaler: best_split_mlp_x_scaler.pkl
  y_scaler: best_split_mlp_y_scaler.pkl
  pca: best_split_mlp_pca.pkl

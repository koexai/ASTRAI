[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astrai"
version = "0.1.0"
description = "Machine-learning tools for astrophysical transient characterization and light-curve generation"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "Koexai S.r.l."}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "pyarrow>=16.0",
  "torch>=2.5",
  "scikit-learn>=1.5",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.scripts]
astrai = "astrai.cli.dispatcher:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"astrai.configs" = ["*.yaml"]

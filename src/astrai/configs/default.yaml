data:
  target_transform: log1p
  format: parquet
  path: data/dataset_preprocessed.parquet
  n_days: 1601
  n_params: 7
  param_names: [Raggio, Massa, Energia, Nickel, Mcsm, Rcsm, Slope]
  samples_per_day: 4

training:
  batch_size: 4096
  epochs: 1000
  learning_rate: 0.001
  n_splits: 2
  # Single base seed; stage-specific and fold-specific seeds are derived.
  random_seed: 42
  validation_fraction: 0.1
  checkpoint_selection:
    metric: R2
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.0

model:
  pca_components: 32
  width: 512
  depth: 10
  dropout: 0.1

loss:
  alpha_char: 1.0
  alpha_gen: 1.0

augmentation:
  noise_std: 0.05
  # Phenomenological availability; no survey cadence or geometry.
  masking:
    annual_period_days: 365.25
    daylight_mean_hours: 12.0
    daylight_amplitude_hours: 2.0
    seasonal_gap_min_days: 0.0
    seasonal_gap_max_days: 90.0
    moon_period_days: 29.53
    moon_active_days: 9.351166666666668
    moon_loss_hours: 4.0
    cloudy_fraction: 0.3
    mean_cloudy_days: 2.3
    threshold_interval_days: 1.0

visualisation:
  y_label: '$\log_{10}(L_{\rm bol}\,[{\rm erg}\,{\rm s}^{-1}])$'
  quantile_summary:
    output_name: clean_light_curves_7par_quantiles
    quantile_ranges:
      Lower 20%: [0.0, 0.2]
      Central 20%: [0.4, 0.6]
      Upper 20%: [0.8, 1.0]

checkpoint:
  model: best_split_mlp_model.pth
  x_scaler: best_split_mlp_x_scaler.pkl
  y_scaler: best_split_mlp_y_scaler.pkl
  pca: best_split_mlp_pca.pkl
